<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brij Vatika — Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root { --bg:#fbf9f4; --surface:#fff; --surface-2:#f3efe4; --ink:#1d1d1f; --ink-2:#515154; --ink-3:#86868b; --line:#e2dcc8; --accent:#8b6b3a; --accent-hover:#74582c; --ok:#30861a; --danger:#c0392b; --warn:#8a4a0b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Inter", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  h1, h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  .topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-family: "Cormorant Garamond", serif; font-size: 20px; font-weight: 500; }
  .brand small { font-family: "Inter", sans-serif; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.4px; margin-left: 6px; font-weight: 500; }
  .topbar button { background: transparent; border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 12px; color: var(--ink-2); cursor: pointer; font-family: inherit; }
  .topbar button:hover { background: var(--surface); }

  /* Login */
  .login { max-width: 400px; margin: 80px auto; padding: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .login h1 { font-size: 28px; margin-bottom: 8px; }
  .login p { margin: 0 0 20px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .login input { width: 100%; padding: 11px 14px; font-size: 15px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; font-family: inherit; }
  .login input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .login button { width: 100%; background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .login button:hover { background: var(--accent-hover); }
  .msg { font-size: 13px; margin-top: 12px; padding: 10px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }
  .msg.ok  { background: color-mix(in srgb, var(--ok) 10%, transparent); color: var(--ok); }
  .note { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 14px; }

  /* App */
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 50px; z-index: 9; }
  .tab-btn { background: transparent; border: none; padding: 12px 16px; font-size: 13px; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; display: inline-flex; align-items: center; gap: 7px; }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-btn .pill { background: var(--surface-2); color: var(--ink-2); font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 500; }
  .tab-btn .pill.alert { background: var(--accent); color: #fff; }
  .view { display: none; max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  .view.active { display: block; }

  /* Lists */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; cursor: pointer; transition: background 0.12s ease, border-color 0.12s ease; }
  .row:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 2%, var(--surface)); }
  .row.new { border-left: 3px solid var(--accent); }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .row-head .who { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
  .row-head .meta { font-size: 12px; color: var(--ink-3); }
  .row-head .time { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .row-body { margin-top: 8px; font-size: 13px; color: var(--ink-2); line-height: 1.5; max-height: 60px; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 10.5px; font-weight: 500; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
  .b-new { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .b-replied { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .b-booked { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .b-declined, .b-spam, .b-cancelled { background: color-mix(in srgb, var(--ink-3) 20%, transparent); color: var(--ink-3); }
  .b-awaiting_details { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .b-scheduled { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .b-completed { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-3); }

  /* Detail modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 680px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.25); overflow: hidden; }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h2 { font-size: 22px; }
  .modal-head .close { background: transparent; border: none; font-size: 22px; cursor: pointer; color: var(--ink-3); padding: 0 4px; }
  .modal-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
  .modal-body .field { margin-bottom: 14px; }
  .modal-body .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-3); margin-bottom: 5px; font-weight: 500; }
  .modal-body .field .val { font-size: 14px; color: var(--ink); line-height: 1.5; word-wrap: break-word; }
  .modal-body .field input, .modal-body .field select, .modal-body .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--ink); }
  .modal-body .field textarea { min-height: 120px; resize: vertical; }
  .modal-body .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .modal-foot { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .modal-foot button { padding: 9px 18px; border-radius: 10px; border: none; font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 500; }
  .modal-foot .primary { background: var(--accent); color: #fff; }
  .modal-foot .primary:hover { background: var(--accent-hover); }
  .modal-foot .ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
  .modal-foot .danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
</style>
</head>
<body>

<div id="login-view" class="login">
  <h1 id="login-title">Admin login</h1>
  <p id="login-help">Enter your 12-hour session password.</p>
  <input id="pwd-in" type="password" placeholder="Password" autocomplete="current-password">
  <input id="pwd-in-2" type="password" placeholder="Confirm password" autocomplete="new-password" style="display:none">
  <input id="setup-token" type="text" placeholder="Setup token (one-time)" style="display:none">
  <button id="submit-btn">Log in</button>
  <div id="login-msg" class="msg"></div>
  <p class="note">Session lasts 12 hours. Lose the password and you'll need to reset via Supabase.</p>
</div>

<div id="app-view" style="display:none">
  <div class="topbar">
    <div class="brand">Brij Vatika<small>Admin</small></div>
    <div><button id="refresh-btn">Refresh</button><button id="logout-btn" style="margin-left:8px">Log out</button></div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-view="enquiries">Enquiries <span class="pill" id="pill-enq">0</span></button>
    <button class="tab-btn" data-view="bookings">Bookings <span class="pill" id="pill-book">0</span></button>
  </nav>
  <div id="enquiries-view" class="view active">
    <div class="list" id="enquiry-list"><div class="empty">Loading…</div></div>
  </div>
  <div id="bookings-view" class="view">
    <div class="list" id="booking-list"><div class="empty">Loading…</div></div>
  </div>
</div>

<!-- Enquiry detail / reply modal -->
<div class="modal-backdrop" id="enq-modal">
  <div class="modal">
    <div class="modal-head"><h2>Reply to enquiry</h2><button class="close" onclick="closeModal('enq-modal')">×</button></div>
    <div class="modal-body">
      <div class="field"><label>From</label><div class="val" id="enq-from"></div></div>
      <div class="field"><label>Topic</label><div class="val" id="enq-topic" style="white-space:pre-wrap"></div></div>
      <div class="field"><label>Subject</label><input type="text" id="enq-subject" value="Re: your enquiry — Brij Vatika"></div>
      <div class="field"><label>Reply</label><textarea id="enq-reply" placeholder="Namaste [Name], ..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="ghost" onclick="closeModal('enq-modal')">Cancel</button>
      <button class="danger" id="enq-decline">Mark declined</button>
      <button class="primary" id="enq-send">Send reply</button>
    </div>
  </div>
</div>

<!-- Booking detail modal -->
<div class="modal-backdrop" id="book-modal">
  <div class="modal">
    <div class="modal-head"><h2>Booking details</h2><button class="close" onclick="closeModal('book-modal')">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Tier · Paid</label><div class="val" id="book-tier"></div></div>
      <div class="field"><label>Buyer</label><div class="val" id="book-buyer"></div></div>
      <div class="two-col">
        <div class="field"><label>Birth name</label><input type="text" id="book-birth-name"></div>
        <div class="field"><label>Birth date</label><input type="date" id="book-birth-date"></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Birth time (HH:MM, 24h)</label><input type="text" id="book-birth-time" placeholder="14:35 or 'unknown'"></div>
        <div class="field"><label>Birth place</label><input type="text" id="book-birth-place" placeholder="City, Country"></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Timezone</label><input type="text" id="book-timezone" placeholder="e.g. US/Pacific"></div>
        <div class="field"><label>Language</label>
          <select id="book-language"><option value="">—</option><option value="hindi">Hindi</option><option value="english">English</option><option value="either">Either</option></select>
        </div>
      </div>
      <div class="field"><label>Scheduled at (ISO)</label><input type="datetime-local" id="book-scheduled"></div>
      <div class="field"><label>Status</label>
        <select id="book-status">
          <option value="awaiting_details">Awaiting details</option>
          <option value="ready_to_schedule">Ready to schedule</option>
          <option value="scheduled">Scheduled</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="refunded">Refunded</option>
        </select>
      </div>
      <div class="field"><label>Notes</label><textarea id="book-notes"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="ghost" onclick="closeModal('book-modal')">Cancel</button>
      <button class="primary" id="book-save">Save</button>
    </div>
  </div>
</div>

<script>
  const API = "https://tjknrhrgvwnxhkwizujn.supabase.co/functions/v1/admin-api";
  const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqa25yaHJndndueGhrd2l6dWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MjQ0MDksImV4cCI6MjEwNzMwMDQwOX0.1KodRnJHY66xMNrWmkq5JDySuNvyBSDAEVj0pPwCIJs";
  const TOKEN_KEY = "bv_admin_token_v1";
  let token = null, mode = 'login', currentView = 'enquiries';
  let enquiries = [], bookings = [], editingEnq = null, editingBook = null;

  const $ = id => document.getElementById(id);
  const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso), m = Math.round((Date.now()-d)/60000); if (m<1) return 'just now'; if (m<60) return m+'m'; if (m<1440) return Math.round(m/60)+'h'; return d.toLocaleDateString(); };

  async function api(path, opts = {}) {
    const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+SB_ANON, 'apikey':SB_ANON, ...(opts.headers||{}) };
    if (token) headers['x-admin-token'] = token;
    const r = await fetch(API + path, { ...opts, headers });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && token) { logout(); throw new Error('Session expired.'); }
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  function showMsg(text, kind) { const m = $('login-msg'); m.textContent = text; m.className = 'msg show ' + kind; }

  async function checkMode() {
    try {
      const d = await (await fetch(API + '/status', { headers: { 'Authorization':'Bearer '+SB_ANON, 'apikey':SB_ANON } })).json();
      if (d.setup_required) {
        mode = 'setup';
        $('login-title').textContent = 'First-time setup';
        $('login-help').textContent = 'Pick a password (8+ characters). Store it safely — no email reset.';
        $('pwd-in').placeholder = 'New password';
        $('pwd-in-2').style.display = 'block';
        $('setup-token').style.display = 'block';
        $('submit-btn').textContent = 'Create password';
      }
    } catch (e) { showMsg(e.message, 'err'); }
  }

  $('submit-btn').addEventListener('click', async () => {
    const p = $('pwd-in').value;
    if (!p) return;
    if (mode === 'setup') {
      if (p !== $('pwd-in-2').value) return showMsg('Passwords do not match.', 'err');
      if (!$('setup-token').value) return showMsg('Setup token required.', 'err');
    }
    $('submit-btn').disabled = true;
    try {
      const body = { password: p };
      if (mode === 'setup') body.setup_token = $('setup-token').value;
      const r = await (await fetch(API + '/verify', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_ANON,'apikey':SB_ANON}, body: JSON.stringify(body) })).json();
      if (!r.ok) throw new Error(r.error || 'Wrong password');
      token = r.token;
      localStorage.setItem(TOKEN_KEY, token);
      $('pwd-in').value = ''; $('pwd-in-2').value = ''; $('setup-token').value = '';
      $('login-view').style.display = 'none';
      $('app-view').style.display = 'block';
      await loadAll();
      setInterval(loadAll, 20000);
    } catch (e) { showMsg(e.message, 'err'); }
    finally { $('submit-btn').disabled = false; }
  });

  $('pwd-in').addEventListener('keydown', e => { if (e.key === 'Enter' && mode === 'login') $('submit-btn').click(); });

  function logout() { token = null; localStorage.removeItem(TOKEN_KEY); $('login-view').style.display = 'block'; $('app-view').style.display = 'none'; }
  $('logout-btn').addEventListener('click', logout);
  $('refresh-btn').addEventListener('click', loadAll);

  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
    currentView = b.dataset.view;
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === currentView + '-view'));
  }));

  async function loadAll() {
    try {
      const [e, bk] = await Promise.all([api('/enquiries'), api('/bookings')]);
      enquiries = e.enquiries || []; bookings = bk.bookings || [];
      renderEnquiries(); renderBookings();
      const nEnq = enquiries.filter(x => x.status === 'new').length;
      const nBook = bookings.filter(x => x.status === 'awaiting_details' || x.status === 'ready_to_schedule').length;
      $('pill-enq').textContent = nEnq; $('pill-enq').classList.toggle('alert', nEnq > 0);
      $('pill-book').textContent = nBook; $('pill-book').classList.toggle('alert', nBook > 0);
    } catch (e) { console.error(e); }
  }

  function renderEnquiries() {
    const list = $('enquiry-list');
    if (!enquiries.length) { list.innerHTML = '<div class="empty">No enquiries yet.</div>'; return; }
    list.innerHTML = enquiries.map(e => `<div class="row ${e.status === 'new' ? 'new' : ''}" data-eid="${e.id}">
      <div class="row-head"><div><div class="who">${esc(e.name)} <span class="badge b-${esc(e.status)}">${esc(e.status)}</span></div><div class="meta">${esc(e.email)}${e.country ? ' · '+esc(e.country) : ''}${e.timezone ? ' · '+esc(e.timezone) : ''}</div></div><div class="time">${fmtTime(e.created_at)}</div></div>
      <div class="row-body">${esc((e.topic || '').slice(0, 240))}${(e.topic||'').length > 240 ? '…' : ''}</div></div>`).join('');
    list.querySelectorAll('[data-eid]').forEach(r => r.addEventListener('click', () => openEnquiry(r.dataset.eid)));
  }

  function renderBookings() {
    const list = $('booking-list');
    if (!bookings.length) { list.innerHTML = '<div class="empty">No bookings yet.</div>'; return; }
    list.innerHTML = bookings.map(b => `<div class="row ${['awaiting_details','ready_to_schedule'].includes(b.status) ? 'new' : ''}" data-bid="${b.id}">
      <div class="row-head"><div><div class="who">${esc(b.buyer_name || b.buyer_email)} <span class="badge b-${esc(b.status)}">${esc(b.status.replace(/_/g,' '))}</span></div><div class="meta">${esc(b.tier_name || b.tier)} · ${esc(String(b.amount_paid || '?'))} ${esc(b.currency || '')}</div></div><div class="time">${fmtTime(b.created_at)}</div></div>
      <div class="row-body">${b.birth_date ? 'DOB '+esc(b.birth_date) : '<em style="color:var(--ink-3)">waiting on birth details</em>'}${b.birth_place ? ' · '+esc(b.birth_place) : ''}${b.scheduled_at ? ' · scheduled '+esc(new Date(b.scheduled_at).toLocaleString()) : ''}</div></div>`).join('');
    list.querySelectorAll('[data-bid]').forEach(r => r.addEventListener('click', () => openBooking(r.dataset.bid)));
  }

  function openEnquiry(id) {
    const e = enquiries.find(x => x.id === id); if (!e) return;
    editingEnq = e;
    $('enq-from').innerHTML = `${esc(e.name)} &lt;${esc(e.email)}&gt;${e.country ? ' · '+esc(e.country) : ''}`;
    $('enq-topic').textContent = e.topic;
    $('enq-reply').value = `Namaste ${e.name.split(' ')[0]},\n\nThank you for reaching out. `;
    $('enq-modal').classList.add('show');
  }

  function openBooking(id) {
    const b = bookings.find(x => x.id === id); if (!b) return;
    editingBook = b;
    $('book-tier').textContent = (b.tier_name || b.tier) + ' · ' + (b.amount_paid || '?') + ' ' + (b.currency || '');
    $('book-buyer').innerHTML = `${esc(b.buyer_name || '—')} &lt;${esc(b.buyer_email)}&gt;`;
    $('book-birth-name').value = b.birth_name || '';
    $('book-birth-date').value = b.birth_date || '';
    $('book-birth-time').value = b.birth_time || '';
    $('book-birth-place').value = b.birth_place || '';
    $('book-timezone').value = b.timezone || '';
    $('book-language').value = b.language_pref || '';
    $('book-scheduled').value = b.scheduled_at ? b.scheduled_at.slice(0, 16) : '';
    $('book-status').value = b.status;
    $('book-notes').value = b.notes || '';
    $('book-modal').classList.add('show');
  }

  function closeModal(id) { $(id).classList.remove('show'); }
  window.closeModal = closeModal;

  $('enq-send').addEventListener('click', async () => {
    if (!editingEnq) return;
    const text = $('enq-reply').value.trim();
    if (!text) return;
    $('enq-send').disabled = true;
    try {
      await api('/send_reply', { method:'POST', body: JSON.stringify({ to: editingEnq.email, subject: $('enq-subject').value, text, reply_to: 'hello@brijvatika.com', enquiry_id: editingEnq.id }) });
      closeModal('enq-modal'); await loadAll();
    } catch (e) { alert('Send failed: ' + e.message); }
    finally { $('enq-send').disabled = false; }
  });

  $('enq-decline').addEventListener('click', async () => {
    if (!editingEnq) return;
    if (!confirm('Mark as declined?')) return;
    try { await api('/update_enquiry', { method:'POST', body: JSON.stringify({ id: editingEnq.id, status: 'declined' }) }); closeModal('enq-modal'); await loadAll(); }
    catch (e) { alert(e.message); }
  });

  $('book-save').addEventListener('click', async () => {
    if (!editingBook) return;
    const patch = {
      id: editingBook.id,
      birth_name: $('book-birth-name').value || null,
      birth_date: $('book-birth-date').value || null,
      birth_time: $('book-birth-time').value || null,
      birth_place: $('book-birth-place').value || null,
      timezone: $('book-timezone').value || null,
      language_pref: $('book-language').value || null,
      scheduled_at: $('book-scheduled').value ? new Date($('book-scheduled').value).toISOString() : null,
      status: $('book-status').value,
      notes: $('book-notes').value || null,
    };
    $('book-save').disabled = true;
    try { await api('/update_booking', { method:'POST', body: JSON.stringify(patch) }); closeModal('book-modal'); await loadAll(); }
    catch (e) { alert(e.message); }
    finally { $('book-save').disabled = false; }
  });

  // Init
  (async () => {
    const saved = localStorage.getItem(TOKEN_KEY);
    if (saved) {
      token = saved;
      try { await api('/session'); $('login-view').style.display = 'none'; $('app-view').style.display = 'block'; await loadAll(); setInterval(loadAll, 20000); return; } catch { token = null; localStorage.removeItem(TOKEN_KEY); }
    }
    await checkMode();
  })();
</script>
